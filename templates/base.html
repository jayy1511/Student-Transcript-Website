<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Portal{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#000000',
                            card: '#0a0a0a',
                            border: '#1f1f1f',
                            hover: '#141414'
                        },
                        brand: {
                            500: '#6366f1', // Indigo
                            600: '#4f46e5',
                            glow: 'rgba(99, 102, 241, 0.5)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-dark-bg text-gray-300 antialiased h-screen flex overflow-hidden" x-data="{ sidebarOpen: false }">

    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity
        class="fixed inset-0 z-20 bg-black/50 lg:hidden glass"></div>

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
        class="fixed inset-y-0 left-0 z-30 w-64 bg-dark-card border-r border-dark-border transition-transform duration-300 lg:static lg:translate-x-0 flex flex-col">

        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-dark-border">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-purple-600 flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                    <span class="text-white font-bold text-lg">E</span>
                </div>
                <span class="text-white font-bold text-xl tracking-tight">Portal</span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-dark-hover group transition-all duration-200 {% if request.path == '/' %}bg-dark-hover text-white shadow-[0_0_10px_rgba(255,255,255,0.05)]{% endif %}">
                <svg class="w-5 h-5 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
                <span class="font-medium">Dashboard</span>
            </a>

            <div class="pt-4 pb-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Populations</div>

            {% for pop in ['AIs', 'CS', 'DSA', 'ISM', 'SE'] %}
            <a href="/populations/{{ pop.lower() }}"
                class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-dark-hover group transition-all duration-200 {% if pop.lower() in request.path %}bg-dark-hover text-white{% endif %}">
                <div class="w-1.5 h-1.5 rounded-full bg-gray-600 group-hover:bg-brand-500 transition-colors"></div>
                <span>MSc {{ pop }}</span>
            </a>
            {% endfor %}
        </nav>

        <!-- User Profile (Bottom) -->
        <div class="p-4 border-t border-dark-border">
            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-dark-hover cursor-pointer transition-colors">
                <div
                    class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold text-white">
                    AD</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate">Admin User</p>
                    <p class="text-xs text-gray-500 truncate">admin@epita.fr</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- Header -->
        <header
            class="h-16 flex items-center justify-between px-6 border-b border-dark-border bg-dark-bg/80 backdrop-blur-md z-10">
            <button @click="sidebarOpen = true" class="lg:hidden text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>

            <div class="flex items-center gap-4 ml-auto">
                <div class="text-xs text-gray-500 font-mono">v2.0.0</div>
            </div>
        </header>

        <!-- Content Scroll Area -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>

            <!-- Footer -->
            <footer class="mt-12 pt-6 border-t border-dark-border text-center text-sm text-gray-600">
                <p>EPITA Student Portal &copy; 2025</p>
            </footer>
        </main>
    </div>

    {% block extra_js %}{% endblock %}
</body>

</html>
